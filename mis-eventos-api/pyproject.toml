[project]
name = "mis-eventos-api"
version = "0.1.0"
description = "API para Mis Eventos"
authors = [
    {name = "Gerson Angel",email = "gerson.angel@hotmail.es"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "pwdlib[argon2] (>=0.2.0,<1.0.0)",
    "python-multipart (>=0.0.21,<0.0.22)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "redis (>=7.1.0,<8.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "aiosqlite (>=0.20.0,<1.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
